[workspace]
name = "ps2-ex1"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"
pandas = ">=2.2,<3"
matplotlib = "*"
jupyterlab = "*"
ipykernel = "*"
nbformat = "*"
pre-commit = "*"
flake8 = "*"
mypy = "*"

[pypi-dependencies]
wbgapi = "*"

[tasks]
jupyter = "jupyter lab"
smoke = "python -c 'import pandas, wbgapi, matplotlib, jupyterlab, ipykernel, nbformat, pre_commit, flake8, mypy; print(\"Imports OK\")'"

[environments]
ps2-ex1 = []
